; Airlock approval key: Arduino Uno + LCD1602 + pot + approve/deny buttons. Setup guide: README.md.
;   uno_lcd          the key firmware (src/main.cpp), bare switches to GND:  pio run -e uno_lcd -t upload
;   uno_lcd_module   the same, for 3-pin button MODULES (VCC, GND, OUT; pressed = HIGH): -DBUTTON_ACTIVE_HIGH=1
;   native           host tests of src/keylogic.h and src/flatjson.h, no board needed:  pio test -e native
; Protocol: gateway/airlock/keyproto.py. Pins and settings: src/config.h.
[platformio]
default_envs = uno_lcd

[env:uno_lcd]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

; Not in default_envs: build it when your buttons are 3-pin modules:  pio run -e uno_lcd_module -t upload
[env:uno_lcd_module]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -DBUTTON_ACTIVE_HIGH=1
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Isrc
